name: Run Post-Call Pipeline

on:
  push:
    branches: [main]
    paths: ['pipeline/**']
  workflow_dispatch:
    inputs:
      blob_path:
        description: 'Blob path to process (e.g., recordings/call-001.wav)'
        required: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  process:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install deps
        run: pip install -r pipeline/requirements.txt
      - name: Run pipeline
        env:
          AZURE_OPENAI_ENDPOINT: ${{ secrets.AZURE_OPENAI_ENDPOINT }}
          AZURE_OPENAI_KEY: ${{ secrets.AZURE_OPENAI_KEY }}
          PG_CONNECTION_STRING: ${{ secrets.PG_CONNECTION_STRING }}
          AZURE_STORAGE_CONNECTION: ${{ secrets.AZURE_STORAGE_CONNECTION }}
        run: |
          echo "Pipeline ready. Trigger with specific blob path or via Azure Data Factory."
